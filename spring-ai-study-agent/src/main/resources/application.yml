spring:
  application:
    name: spring-ai-demo
  # Local secrets live in application-local.yml next to the process working directory.
  # Also accepts ./spring-ai-study-agent/application-local.yml when launched from the repo root.
  # SPRING_AI_OPENAI_API_KEY overrides the file when that environment variable is set.
  config:
    import: optional:file:./application-local.yml,optional:file:./spring-ai-study-agent/application-local.yml

  ai:
    openai:
      base-url: https://tokenhub.tencentmaas.com/v1
      chat:
        model: hy3
        temperature: 0.7

    # ---------------- MCP 客户端：连接外部 MCP Server ----------------
    mcp:
      client:
        # 默认关闭：starter 的 enabled 默认值为 true，显式关掉可避免启动时连接外部服务
        enabled: true
        type: SYNC
        # Do not initialize at startup. The first listTools() call connects, and
        # ToolCatalog skips this server if npx or the package is unavailable.
        initialized: false
        request-timeout: 10s
        toolcallback:
          enabled: true
        stdio:
          servers-configuration: classpath:mcp-servers.json
        # 远程 Streamable HTTP 连接（需要时再打开，默认不留任何连接）：
        # streamable-http:
        #   connections:
        #     remote:
        #       url: ${MCP_HTTP_URL:}
        #       endpoint: /mcp
        # 注意：2.0.1 的 ConnectionParameters 只有 url/endpoint，不支持 headers，
        # 带 token 的远程服务需自定义 transport/customizer，超出本次最小闭环。
        # SSE 配置（spring.ai.mcp.client.sse）自 2.0.0 起已被标记为 @Deprecated。

# ---------------- 应用侧外部工具配置 ----------------
app:
  # 应用侧二次开关，默认与 MCP_ENABLED 联动；关闭时统一工具目录跳过 MCP 收集
  mcp-enabled: true
  external:
    # 自写 REST 适配层的目标地址，默认指向本应用内的验证用 mock 端点
    base-url: ${EXTERNAL_BASE_URL:http://localhost:8080/mock}
    connect-timeout: 2s
    read-timeout: 3s
  external-mock:
    # 仅为「最小闭环」提供可验证的本地 HTTP 目标，生产环境应置为 false
    enabled: ${EXTERNAL_MOCK_ENABLED:true}

react:
  max-round: 8
  memory-max-messages: 40
  system-message: "你是旅行助手。规划出行时请调用天气、酒店、小吃和景点等内部工具，也可调用外部 REST 与 MCP 工具，再根据工具结果给出具体建议。"

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    org.springframework.ai.model.tool.DefaultToolCallingManager: DEBUG
